<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Part 107 Quiz Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column, like a checklist card. Home -> one question at a time -> results. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #14202e;
  --muted: #5a6878;
  --line: #d5dce5;
  --accent: #1f5fa8;      /* sectional-chart blue */
  --accent-fg: #ffffff;
  --accent-soft: #e3edf8;
  --good: #1b7a46;
  --good-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151d; --surface: #16202b; --fg: #e6ecf3; --muted: #93a2b3; --line: #2a3745;
    --accent: #6fa8e8; --accent-fg: #0b1520; --accent-soft: #1b2c40;
    --good: #55c487; --good-soft: #15291f; --bad: #ff8a80; --bad-soft: #301816;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151d; --surface: #16202b; --fg: #e6ecf3; --muted: #93a2b3; --line: #2a3745;
  --accent: #6fa8e8; --accent-fg: #0b1520; --accent-soft: #1b2c40;
  --good: #55c487; --good-soft: #15291f; --bad: #ff8a80; --bad-soft: #301816;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 1.125rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top .sub { color: var(--muted); font-size: 0.875rem; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }

.fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fieldset legend { padding: 0; margin-bottom: 8px; }
.radio { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio:has(input:disabled) { opacity: 0.5; cursor: not-allowed; }
.radio input { margin-top: 4px; accent-color: var(--accent); }
.radio span { display: flex; flex-direction: column; min-width: 0; }
.radio small { color: var(--muted); font-size: 0.8125rem; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 18px; font-weight: 500; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 8px 10px; min-height: 36px; font-size: 0.875rem; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.areas { display: flex; flex-direction: column; gap: 12px; }
.area { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.area .name { min-width: 0; }
.area .nums { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--good); }
.bar .no { background: var(--bad); }
.note { font-size: 0.8125rem; color: var(--muted); }

.qhead { display: flex; align-items: center; gap: 12px; }
.qhead .count { font-family: var(--font-mono); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width 0.2s ease; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font-family: var(--font-mono); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.fig { border-color: var(--accent); color: var(--accent); }
.stem { font-size: 1.1875rem; line-height: 1.45; font-weight: 500; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .ltr { font-family: var(--font-mono); font-weight: 500; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; font-size: 0.8125rem; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .ltr { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ltr { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.verdict { font-weight: 600; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score b { font-family: var(--font-mono); font-size: 2.5rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
.pill { font-size: 0.8125rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.miss { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.miss:first-child { border-top: 0; padding-top: 0; }
.miss .q { font-weight: 500; }
.miss .a { font-size: 0.9375rem; display: flex; gap: 8px; }
.miss .a .k { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); width: 56px; flex: none; padding-top: 3px; }
.miss .a.g { color: var(--good); }
.miss .a.r { color: var(--bad); }

@media (max-width: 480px) {
  .stats { gap: 8px; }
  .stat b { font-size: 1.25rem; }
  .panel { padding: 16px; }
  .stem { font-size: 1.0625rem; }
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const DATA = [[1,"What are characteristics of a moist, unstable air mass?",["Turbulence and showery precipitation.","Poor visibility and smooth air.","Haze and smoke."],0,"UA.III.B.K1d"],[2,"According to 14 CFR part 107, how may a remote pilot operate an unmanned aircraft in Class C airspace?",["The remote pilot must have prior authorization from the Air Traffic Control (ATC) facility having jurisdiction over that airspace.","The remote pilot must monitor the Air Traffic Control (ATC) frequency from launch to recovery.","The remote pilot must contact the Air Traffic Control (ATC) facility after launching the unmanned aircraft."],0,"UA.I.B.K16"],[3,"According to 14 CFR part 107 the remote pilot in command (PIC) of a small unmanned aircraft planning to operate within Class C airspace:",["must use a visual observer.","is required to file a flight plan.","is required to receive ATC authorization."],2,"UA.I.B.K16"],[4,"What effect does high density altitude have on the efficiency of a UA propeller?",["Propeller efficiency is increased.","Propeller efficiency is decreased.","Density altitude does not affect propeller efficiency."],1,"UA.III.B.K1a"],[5,"(Refer to FAA-CT-8080-2H, Figure 22, area 2.) At Coeur D’Alene which frequency should be used as a Common Traffic Advisory Frequency (CTAF) to monitor airport traffic?",["122.05 MHz.","135.075 MHz.","122.8 MHz."],2,"UA.V.A.K2"],[6,"Which technique should a remote pilot use to scan for traffic? A remote pilot should:",["systematically focus on different segments of the sky for short intervals.","concentrate on relative movement detected in the peripheral vision area.","continuously scan the sky from right to left."],0,"UA.I.B.K14"],[7,"(Refer to FAA-CT-8080-2H, Figure 2.) If an unmanned airplane weighs 33 pounds, what approximate weight would the airplane structure be required to support during a 30° banked turn while maintaining altitude?",["34 pounds.","47 pounds.","38 pounds."],2,"UA.IV.A.K1a"],[8,"(Refer to FAA-CT-8080-2H, Figure 23, area 3.) What is the floor of the Savannah Class C airspace at the shelf area (outer circle)?",["1,300 feet AGL.","1,300 feet MSL.","1,700 feet MSL."],1,"UA.II.A.K1b"],[9,"(Refer to FAA-CT-8080-2H, Figure 20, area 3.) With ATC authorization, you are operating your small unmanned aircraft approximately 4 SM southeast of Elizabeth City Regional Airport (ECG). What hazard is indicated to be in that area?",["High density military operations in the vicinity.","Unmarked balloon on a cable up to 3,008 feet AGL.","Unmarked balloon on a cable up to 3,008 feet MSL."],2,"UA.V.B.K6a"],[10,"(Refer to FAA-CT-8080-2H, Figure 21.) You have been hired by a farmer to use your small UA to inspect his crops. The area that you are to survey is in the Devil’s Lake West MOA, east of area 2. How would you find out if the MOA is active?",["Refer to the chart legend.","This information is available in the Small UAS database.","Refer to the Military Operations Directory."],0,"UA.II.A.K2"],[11,"The most comprehensive information on a given airport is provided by:",["the Chart Supplements U.S. (formerly Airport Facility Directory).","Notices to Airmen (NOTAMS).","Terminal Area Chart (TAC)."],0,"UA.V.B.K6b"],[12,"Identify the hazardous attitude or characteristic a remote pilot displays while taking risks in order to impress others?",["Impulsivity","Invulnerability.","Macho."],2,"UA.V.D.K4"],[13,"(Refer to FAA-CT-8080-2H, Figure 26, area 4.) You have been hired to inspect the tower under construction at 46.9N and 98.6W, near Jamestown Regional (JMS). What must you receive prior to flying your unmanned aircraft in this area?",["Authorization from the military.","Authorization from ATC.","Authorization from the National Park Service."],1,"UA.V.B.K6a"],[14,"(Refer to FAA-CT-8080-2H, Figure 20, area 5.) How would a remote PIC \"CHECKNOTAMS\" as noted in the CAUTION box regarding the unmarked balloon?",["By utilizing the B4UFLY mobile application.","By contacting the FAA district office.","By obtaining a briefing via an online source such as: 1800WXBrief.com."],2,"UA.II.B.K5"],[15,"When adapting crew resource management (CRM) concepts to the operation of a small UA, CRM must be integrated into:",["the flight portion only.","all phases of the operation.","the communications only."],1,"UA.V.D.K2"],[16,"You have been hired as a remote pilot by a local TV news station to film breaking news with a small UA. You expressed a safety concern and the station manager has instructed you to ‘fly first, ask questions later.’ What type of hazardous attitude does this attitude represent?",["Machismo.","Invulnerability.","Impulsivity."],2,"UA.V.D.K4"],[17,"A local TV station has hired a remote pilot to operate their small UA to cover news stories. The remote pilot has had multiple near misses with obstacles on the ground and two small UAS accidents. What would be a solution for the news station to improve their operating safety culture?",["The news station should implement a policy of no more than five crashes/incidents within 6 months.","The news station does not need to make any changes; there are times that an accident is unavoidable.","The news station should recognize hazardous attitudes and situations and develop standard operating procedures that emphasize safety."],2,"UA.V.D.K5"],[18,"(Refer to FAA-CT-8080-2H, Figure 26, area 2.) While monitoring the Cooperstown CTAF you hear an aircraft announce that they are midfield left downwind to RWY 13. Where would the aircraft be relative to the runway?",["The aircraft is East.","The aircraft is South.","The aircraft is West."],0,"UA.V.B.K4"],[19,"To avoid a possible collision with a manned airplane, you estimate that your small UA climbed to an altitude greater than 600 feet AGL. To whom must you report the deviation?",["Air Traffic Control.","The National Transportation Safety Board.","Upon request of the Federal Aviation Administration."],2,"UA.I.B.K5"],[20,"When operating an unmanned airplane, the remote pilot should consider that the load factor on the wings may be increased any time:",["the CG is shifted rearward to the aft CG limit.","the airplane is subjected to maneuvers other than straight-and-level flight.","the gross weight is reduced."],1,"UA.IV.A.K1a"],[21,"A stall occurs when the smooth airflow over the unmanned airplane’s wing is disrupted and the lift degenerates rapidly. This is caused when the wing:",["exceeds the maximum speed.","exceeds maximum allowable operating weight.","exceeds its critical angle of attack."],2,"UA.IV.A.K1"],[22,"Safety is an important element for a remote pilot to consider prior to operating an unmanned aircraft system. To prevent the final \"link\" in the accident chain, a remote pilot must consider which methodology?",["Crew Resource Management.","Safety Management System.","Risk Management."],2,"UA.V.D.K5"],[23,"You are a remote pilot for a co-op energy service provider. You are to use your UA to inspect power lines in a remote area 15 hours away from your home office. After the drive, fatigue impacts your abilities to complete your assignment on time. Fatigue can be recognized:",["easily by an experienced pilot.","as being in an impaired state.","by an ability to overcome sleep deprivation."],1,"UA.V.D.K5"],[24,"(Refer to FAA-CT-8080-2H, Figure 21.) What airport is located approximately 47(degrees) 40 (minutes) N latitude and 101 (degrees) 26 (minutes) W longitude?",["Mercer County Regional Airport.","Semshenko Airport.","Garrison Airport."],2,"UA.V.B.K6a"],[25,"(Refer to FAA-CT-8080-2H, Figure 12.) What are the current conditions for Chicago Midway Airport (KMDW)?",["Sky 700 feet overcast, visibility 1-1/2SM, rain.","Sky 7,000 feet overcast, visibility 1-1/2SM, heavy rain.","Sky 700 feet overcast, visibility 11, occasionally 2SM, with rain."],0,"UA.III.A.K2"],[26,"(Refer to FAA-CT-8080-2H, Figure 12.) The wind direction and velocity at KJFK is from:",["180° true at 4 knots.","180° magnetic at 4 knots.","040° true at 18 knots."],0,"UA.III.A.K2"],[27,"According to 14 CFR part 107, what is required to operate a small UA within 30minutes after official sunset?",["Use of anti-collision lights.","Must be operated in a rural area.","Use of a transponder."],0,"UA.I.B.K24"],[28,"To ensure that the unmanned aircraft center of gravity (CG) limits are not exceeded, follow the aircraft loading instructions specified in the:",["Pilot’s Operating Handbook or UAS Flight Manual.","Aeronautical Information Manual (AIM).","Aircraft Weight and Balance Handbook."],0,"UA.IV.A.K1b"],[29,"According to 14 CFR part 107, who is responsible for determining the performance of a small unmanned aircraft?",["Remote pilot-in-command.","Manufacturer.","Owner or operator."],0,"UA.I.B.K4"],[30,"(Refer to FAA-CT-8080-2H, Figure 59, area 2.) The chart shows a gray line with\"VR1667, VR1617, VR1638, and VR1668.\" Could this area present a hazard to the operations of a small UA?",["No, all operations will be above 400 feet.","Yes, this is a Military Training Route from the surface to 1,500 feet AGL.","Yes, the defined route provides traffic separation to manned aircraft."],1,"UA.II.A.K3"],[31,"(Refer to FAA-CT-8080-2H, Figure 26.) What does the line of latitude at area 4 measure?",["The degrees of latitude east and west of the Prime Meridian.","The degrees of latitude north and south of the equator.","The degrees of latitude east and west of the line that passes through Greenwich, England."],1,"UA.V.B.K6a"],[32,"Under what condition should the operator of a small UA establish scheduled maintenance protocol?",["When the manufacturer does not provide a maintenance schedule.","UAS does not need a required maintenance schedule.","When the FAA requires you to, following an accident."],0,"UA.V.F.K1"],[33,"According to 14 CFR part 107, the responsibility to inspect the small UAS to ensure itis in a safe operating condition rests with the:",["remote pilot-in-command.","visual observer.","owner of the small UAS."],0,"UA.I.B.K2"],[34,"According to 14 CFR part 48, when would a small UA owner not be permitted to register it?",["If the owner is less than 13 years of age.","All persons must register their small UA.","If the owner does not have a valid United States driver’s license."],0,"UA.I.B.K1"],[35,"According to 14 CFR part 48, when must a person register a small UA with the Federal Aviation Administration?",["All civilian small UAs weighing greater than .55 pounds must be registered regardless of its intended use.","When the small UA is used for any purpose other than as a model aircraft.","Only when the operator will be paid for commercial services."],0,"UA.I.B.K1"],[36,"Which is true regarding the presence of alcohol within the human body?",["A small amount of alcohol increases vision acuity.","Consuming an equal amount of water will increase the destruction of alcohol and alleviate a hangover.","Judgment and decision-making abilities can be adversely affected by even small amounts of alcohol."],2,"UA.V.E.K2"],[37,"When using a small UA in a commercial operation, who is responsible for briefing the participants about emergency procedures?",["The FAA inspector-in-charge.","The lead visual observer.","The remote PIC.spaceworkspac5"],2,"UA.I.B.K20"],[38,"What are the characteristics of stable air?",["Good visibility and steady precipitation.","Poor visibility and steady precipitation.","Poor visibility and intermittent precipitation."],1,"UA.III.B.K1c"],[39,"You have received an outlook briefing from flight service through 1800wxbrief.com. The briefing indicates you can expect a low-level temperature inversion with high relative humidity. What weather conditions would you expect?",["Smooth air, poor visibility, fog, haze, or low clouds.","Light wind shear, poor visibility, haze, and light rain.","Turbulent air, poor visibility, fog, low stratus type clouds, and showery precipitation."],0,"UA.III.B.K1c"],[40,"When may a remote pilot reduce the intensity of an aircraft’s lights during a night flight?",["At no time may the lights of an sUAS be reduced in intensity at night.","When a manned aircraft is in the vicinity of the sUAS.","When it is in the interest of safety to dim the aircraft's lights."],2,"UA.I.B.K25"],[41,"What must a person who is manipulating the controls of a small unmanned aircraft, do if the standard remote identification fails during a flight?",["Land the aircraft as soon as practicable.","Notify the nearest FAA Air Traffic facility.","Activate the aircraft’s navigation lights."],0,"UA.I.F.K1"],[42,"Where must a small unmanned aircraft’s serial number be listed when using either standard remote identification or a broadcast module?",["The aircraft’s Document of Compliance.","The manufacturer’s Method of Compliance.","The Certificate of Aircraft Registration."],2,"UA.I.F.K1"],[43,"When preparing for a night flight, what should an sUAS pilot be aware of after assembling and conducting a preflight of an aircraft while using a bright flashlight or work light?",["Once adapted to darkness, a person’s eyes are relatively immune to bright lights.","It takes approximately 30 minutes for a person’s eyes to fully adapt to darkness.","The person should use a flashlight equipped with LED lights to facilitate their night vision."],1,"UA.V.E.K8"],[44,"To conduct Category 1 operations, a remote pilot in command must use a small unmanned aircraft that weighs:",["0.55 pounds or less.","0.65 pounds or less.","0.75 pounds or less."],0,"UA.I.E.K3a"],[45,"Which Category of small unmanned aircraft must have an airworthiness certificate issued by the FAA?",["4","3","2"],0,"UA.I.E.K3d"],[46,"Your surveying company is a title sponsor for a race team at the Indianapolis 500. To promote your new aerial surveying department, you decide to video part of the race using a small UA. The FAA has issued a Temporary Flight Restriction (TFR) for the race in the area you plan to fly. In this situation:",["you may fly your drone in the TFR since your company is sponsoring a team at the race.","the TFR applies to all aircraft; you may not fly in the area without a Certificate of Waiver or Authorization.","flying your drone is allowed if you notify all non-participating people of the closed course UA operation."],1,"UA.I.B.K19"],[47,"A small UA causes an accident and your crew member loses consciousness. When do you report the accident?",["No accidents need to be reported.","When requested by the UA owner.","Within 10 days of the accident."],2,"UA.I.A.K4"],[48,"Under what condition would a small UA not have to be registered before it is operated in the United States?",["When the aircraft weighs less than .55 pounds on takeoff, including everything that is on-board or attached to the aircraft.","When the aircraft has a takeoff weight that is more than .55 pounds, but less than 55 pounds, not including fuel and necessary attachments.","All small UAS need to be registered regardless of the weight of the aircraft before, during, or after the flight."],0,"UA.I.B.K1"],[49,"A small UA must be operated in a manner which:",["does not endanger the life or property of another.","requires more than one visual observer.","never exceeds 200 feet AGL"],0,"UA.I.B.K6a"],[50,"You plan to release golf balls from your small UA at an altitude of 100 feet AGL. You must ensure the objects being dropped will:",["not create an undue hazard to persons or property.","land within 10 feet of the expected landing zone.","not cause property damage in excess of $300."],0,"UA.I.B.K6b"],[51,"After having dinner and wine, your client asks you to go outside to demonstrate the small UAs capabilities. You must:",["pass a self-administered sobriety test before operating a small UA.","not operate a small UA within 8 hours of consuming any alcoholic beverage.","ensure that your visual observer has not consumed any alcoholic beverage in the previous 12 hours."],1,"UA.I.B.K8"],[52,"According to 14 CFR part 107, what is required to operate a small UA within 30 minutes after official sunset?",["Use of anti-collision lights.","Must be operated in a rural area.","Use of a transponder."],0,"UA.I.B.K24"],[53,"During a flight of your small UA, you observe a hot air balloon entering the area. You should:",["yield the right-of-way to the hot air balloon.","ensure the UA passes below, above, or ahead of the balloon.","expect the hot air balloon to climb above your altitude."],0,"UA.I.B.K14"],[54,"(Refer to FAA-CT-8080-2H, Figure 78.) You have been hired to use your small UAS to inspect the railroad tracks from Blencoe (SE of Sioux City) to Onawa. Will ATC authorization be required?",["Yes, Onawa is in Class D airspace that is designated for an airport.","No, your entire flight is in Class G airspace.","Yes, you must contact the Onawa control tower to operate within 5 miles of the airport."],1,"UA.II.A.K1e"],[55,"According to 14 CFR part 107, what is the maximum groundspeed for a small UA?",["87 knots.","87 mph.","100 knots."],0,"UA.I.B.K21a"],[56,"(Refer to FAA-CT-8080-2H, Figure 78.) You have been contracted to inspect towers located approximately 4NM southwest of the Sioux Gateway (SUX) airport operating an unmanned aircraft. What is the maximum altitude above ground level (AGL) that you are authorized to operate over the top of the towers?",["400 Feet AGL.","402 feet AGL.","802 feet AGL."],2,"UA.I.B.K21b"],[57,"Upon request by the FAA, the remote pilot-in-command must provide:",["a logbook documenting small UA landing currency.","a remote pilot certificate with a small UAS rating.","any employer issued photo identification."],1,"UA.I.A.K5"],[58,"The refusal of a remote PIC to submit to a blood alcohol test when requested by a law enforcement officer:",["is grounds for suspension of revocation of their remote pilot certificate.","can be delayed for a period up to 8 hours after the request.","has no consequences to the remote pilot certificate."],0,"UA.I.C.K2"],[59,"(Refer to FAA-CT-8080-2H, Figure 25, Area 3.) The floor of Class B airspace at Dallas Execu r soft surface.","that is as far away from crew members as possible."],0,"UA.I.B.K25"],[366,"A person may not use a Remote ID broadcast module that:",["is installed by anyone other than the UA manufacturer.","relies solely on a software upgrade to existing hardware on the UA.","fails the self-test when powered on."],2,"UA.I.F.K2"],[367,"Crests of standing mountain waves may be marked by stationary, lens-shaped clouds known as:",["Cumulonimbus clouds.","Standing lenticular clouds.","Roll clouds."],1,"UA.III.B.K1b"],[368,"An almond or lens-shaped cloud which appears stationary, but which may contain winds of 50 knots or more, is referred to as:",["a lenticular cloud.","an inactive frontal cloud.","a funnel cloud."],0,"UA.III.B.K1b"],[369,"You’re flying near mountains, and there are lenticular clouds. What kind of weather should you expect?",["Snow showers.","Smooth air.","High winds and turbulence."],2,"UA.III.B.K1b"],[370,"Under international civil aviation regulations, an aircraft may be registered in how many countries at a time?",["In as many countries as the owner chooses.","Only in one country at a time.","In up to two countries simultaneously."],1,"UA.I.B.K1"],[371,"After receiving a part 107 remote pilot certificate with an sUAS rating, how often must you satisfy recurrent training requirements?",["Within 6 calendar months.","Within 12 calendar months.","Within 24 calendar months."],2,"UA.I.C.K4"],[372,"According to 14 CFR part 107, an sUAS is a unmanned aircraft system weighing:",["Less than 55 lbs.","55 lbs.","55kg or less."],0,"UA.I.A.K2"],[373,"Unmanned aircraft means an aircraft operated:",["During search and rescue operations other than public.","Autonomously by onboard computers.","Without the possibility of direct human intervention from within or on the aircraft."],2,"UA.I.A.K2"],[374,"Which of the following operations require adherence to 14 CFR 107?",["Flying a sUAS for enjoyment with family and friends.","Operations conducted outside the United States.","Operating an sUAS for compensation."],2,"UA.I.A.K1"],[375,"According to 14 CFR part 48, when would a small unmanned aircraft owner not be permitted to register it?",["If the owner is less than 13 years of age.","All persons are eligible to register a small unmanned aircraft.","If the owner does not have a valid United States driver’s license."],0,"UA.I.B.K1"],[376,"Which of the following statements is TRUE about small unmanned aircraft registration with the FAA before operation in the National Airspace System (NAS)?",["All small unmanned aircraft operating under part 107 must be registered.","Small unmanned aircraft do not require registration.","Only unmanned aircraft that weigh 55 pounds or more must be registered."],0,"UA.I.B.K1"],[377,"When using a small unmanned aircraft in a non-recreational operation, who is responsible for informing the participants about emergency procedures?",["The Remote Pilot in Command.","The FAA Inspector-in-Charge.","The lead visual observer."],0,"UA.I.B.K20"],[378,"Scheduled maintenance should be performed in accordance with the:",["Contractor requirements.","Stipulations in 14 CFR part 43.","Manufacturer’s recommendations."],2,"UA.V.F.K1"],[379,"As part of an overall safety risk assessment for flight, when should the Remote Pilot in Command check and consider weather conditions in the operating area?",["Only when planning an operation with unfamiliar small UAS equipment.","Prior to and throughout the duration of every small UAS flight.","Never. Weather factors cannot influence small UAS performance."],1,"UA.I.B.K20"],[380,"Part 89 Remote Identification (Remote ID) requirements:",["Apply to all unmanned aircraft operating under Part 107.","Only apply to unmanned aircraft that weigh less than 0.55 lbs.","Do not apply to unmanned aircraft."],0,"UA.I.F.K1"],[381,"Before each flight, the Remote Pilot in Command must ensure that:",["The site supervisor has approved the flight.","Objects carried on the sUAS are secure.","TSA has granted clearance."],1,"UA.I.B.K20"],[382,"According to 14 CFR part 107, who is responsible for ensuring that all control links between the ground control station and the small unmanned aircraft are working properly?",["Owner or operator.","Manufacturer.","Remote Pilot in Command."],2,"UA.I.B.K20"],[383,"According to 14 CFR part 107, what is required to operate a small unmanned aircraft in civil twilight or at night?",["Selection of a rural area for conducting the operation.","Use of lighted anti-collision lights.","Use of a transponder."],1,"UA.II.B.K10"],[384,"When conducting operations during civil twilight or at night, the small unmanned aircraft must be equipped with anti-collision lights that are capable of being visible for at least:",["5 statute miles (sm) from the control station.","3 statute miles (sm) from the control station.","1 statute mile (sm) from the control station."],1,"UA.II.B.K10"],[385,"When does a Remote Pilot in Command operating at night have the discretion to reduce the intensity of the anti-collision lighting?",["Never.","In the interest of operational safety.","Only at the start of a night operation."],1,"UA.II.B.K10"],[386,"Without prior ATC authorization, you can fly your sUAS below 400 feet above the ground (AGL) and:",["On private property.","With at least one designated visual observer.","In uncontrolled airspace."],2,"UA.II.A.K1e"],[387,"To conduct Category 1 operations over people, the small unmanned aircraft:",["Must be listed in an FAA-approved Declaration of Compliance (DoC).","Must weigh 0.55 pounds or less, including everything that is on board or attached.","Must be labeled to indicate the eligible category."],1,"UA.I.E.K3a"],[388,"For Category 2 operations over people, the small unmanned aircraft:",["Must not contain any exposed rotating parts that could lacerate human skin.","May only be operated in a closed or restricted-access site.","Must be equipped with a siren to alert persons who are not directly involved in the operation."],0,"UA.I.E.K17"],[389,"For Category 3 operations over people, the small unmanned aircraft must not cause injury equivalent to or greater than the impact of:",["11 foot-pounds of kinetic energy.","25 foot-pounds of kinetic energy.","5 foot-pounds of kinetic energy."],1,"UA.I.E.K16"],[390,"For Category 1, 2, and 4 operations over people, sustained flight over open air assemblies are restricted to small unmanned aircraft that:",["Are operated at FAA-recognized identification areas (FRIAs).","Weigh more than 55 pounds.","Meet part 89 Remote ID requirements."],2,"UA.I.E.K10"],[391,"In accordance with 14 CFR part 107, you may operate an sUAS from a moving vehicle when no property is carried for compensation or hire:",["Over a sparsely populated area.","Over a parade or other social events.","Over suburban areas."],0,"UA.I.B.K7"],[392,"A small unmanned aircraft without Remote ID that is equipped after production with a Remote ID broadcast module:",["May not be operated in the National Airspace System (NAS).","May only operate at FAA-recognized identification areas (FRIAs).","Is limited to visual line of sight (VLOS) operations. rev 8"],2,"UA.I.F.K2"]];
const AREAS = {
  I: "Regulations",
  II: "Airspace and charts",
  III: "Weather",
  IV: "Loading and performance",
  V: "Operations and aeronautical decisions"
};
const PASS = 0.7, QUIZ_LEN = 20, KEY = "p107-quiz-stats-v1";
const QS = DATA.map((d, i) => {
  const m = d[4] ? d[4].match(/^UA\.([IVX]+)\./) : null;
  const fig = d[1].match(/Figure\s+(\d+)/);
  return { id: d[0], stem: d[1], opts: d[2], ans: d[3], code: d[4] || "", area: m ? m[1] : "?", fig: fig ? fig[1] : "" };
});
const BYID = {}; QS.forEach(q => BYID[q.id] = q);

let stats = {};
try { stats = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { stats = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch (e) {} }

const S = { view: "home", mode: "smart", area: "all", run: null, confirmReset: false };
const app = document.getElementById("app");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(n, d) { return d ? Math.round(100 * n / d) : 0; }

function totals() {
  let seen = 0, right = 0, tries = 0, missed = 0;
  QS.forEach(q => { const s = stats[q.id]; if (s) { seen++; right += s.c; tries += s.t; if (!s.l) missed++; } });
  return { seen, right, tries, missed };
}
function pool() { return QS.filter(q => S.area === "all" || q.area === S.area); }
function pick() {
  const p = pool();
  if (S.mode === "random") return shuffle(p).slice(0, QUIZ_LEN);
  if (S.mode === "missed") return shuffle(p.filter(q => stats[q.id] && !stats[q.id].l)).slice(0, QUIZ_LEN);
  const g = [[], [], []];
  p.forEach(q => { const s = stats[q.id]; g[!s ? 1 : (!s.l ? 0 : 2)].push(q); });
  return [].concat(shuffle(g[0]), shuffle(g[1]), shuffle(g[2])).slice(0, QUIZ_LEN);
}

function start(ids) {
  if (!ids || !ids.length) return;
  S.run = { ids: ids, i: 0, picked: null, results: [] };
  S.view = "quiz"; render(); window.scrollTo(0, 0);
}

function render() {
  if (S.view === "home") home();
  else if (S.view === "quiz") quiz();
  else results();
}

function home() {
  const t = totals();
  const missedInArea = pool().filter(q => stats[q.id] && !stats[q.id].l).length;
  if (S.mode === "missed" && !missedInArea) S.mode = "smart";
  const areaRows = Object.keys(AREAS).map(k => {
    const list = QS.filter(q => q.area === k);
    let seen = 0, ok = 0;
    list.forEach(q => { const s = stats[q.id]; if (s) { seen++; if (s.l) ok++; } });
    return '<div class="area"><span class="name">' + esc(AREAS[k]) + '</span><span class="nums">' + seen + "/" + list.length + ' seen</span>' +
      '<div class="bar" role="img" aria-label="' + ok + ' last answered right, ' + (seen - ok) + ' last answered wrong, out of ' + list.length + '">' +
      '<i class="ok" style="width:' + (100 * ok / list.length) + '%"></i><i class="no" style="width:' + (100 * (seen - ok) / list.length) + '%"></i></div></div>';
  }).join("");
  const modeOpt = (v, title, sub, dis) =>
    '<label class="radio"><input type="radio" name="mode" value="' + v + '"' + (S.mode === v ? " checked" : "") + (dis ? " disabled" : "") + '><span>' + title + '<small>' + sub + '</small></span></label>';
  const areaOpts = '<option value="all">All areas (' + QS.length + ')</option>' + Object.keys(AREAS).map(k =>
    '<option value="' + k + '"' + (S.area === k ? " selected" : "") + ">" + k + " · " + esc(AREAS[k]) + " (" + QS.filter(q => q.area === k).length + ")</option>").join("");
  app.innerHTML =
    '<div class="top"><h1>Part 107 Quiz Bank</h1><span class="sub">' + QS.length + ' questions, ' + QUIZ_LEN + ' per round</span></div>' +
    '<section class="panel" aria-label="Progress"><div class="stats">' +
      '<div class="stat"><span class="label">Seen</span><b>' + t.seen + '<span class="note"> / ' + QS.length + '</span></b></div>' +
      '<div class="stat"><span class="label">Accuracy</span><b>' + (t.tries ? pct(t.right, t.tries) + "%" : "–") + '</b></div>' +
      '<div class="stat"><span class="label">To review</span><b>' + t.missed + '</b></div></div></section>' +
    '<section class="panel"><h2>Start a round</h2>' +
      '<fieldset class="fieldset"><legend class="label">Which questions</legend>' +
        modeOpt("smart", "New and missed first", "Questions you have not seen or last got wrong come up before the rest.") +
        modeOpt("random", "Fully random", "Any " + QUIZ_LEN + " from the pool.") +
        modeOpt("missed", "Missed only (" + missedInArea + ")", "Only questions you last answered wrong.", !missedInArea) +
      '</fieldset>' +
      '<div class="fieldset"><label class="label" for="area">Topic</label><select id="area">' + areaOpts + '</select></div>' +
      '<div class="row"><button class="btn primary" id="go">Start ' + Math.min(QUIZ_LEN, S.mode === "missed" ? missedInArea : pool().length) + ' questions</button></div>' +
      '<p class="note">Many questions refer to figures in the FAA-CT-8080-2H supplement. Keep a copy open for those; they are tagged.</p>' +
    '</section>' +
    '<section class="panel"><h2>By topic</h2><div class="areas">' + areaRows + '</div>' +
      '<p class="note">Green is last answered right, red is last answered wrong.</p></section>' +
    '<div class="row"><span class="note">Progress is saved in this browser.</span><span class="spacer"></span>' +
      (S.confirmReset
        ? '<button class="btn danger" id="reset-yes">Erase progress</button><button class="btn quiet" id="reset-no">Cancel</button>'
        : '<button class="btn quiet" id="reset">Reset progress</button>') + '</div>';
  app.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", () => { S.mode = r.value; home(); }));
  document.getElementById("area").addEventListener("change", e => { S.area = e.target.value; home(); });
  document.getElementById("go").addEventListener("click", () => start(pick().map(q => q.id)));
  const rs = document.getElementById("reset"); if (rs) rs.addEventListener("click", () => { S.confirmReset = true; home(); });
  const ry = document.getElementById("reset-yes"); if (ry) ry.addEventListener("click", () => { stats = {}; save(); S.confirmReset = false; home(); });
  const rn = document.getElementById("reset-no"); if (rn) rn.addEventListener("click", () => { S.confirmReset = false; home(); });
}

function quiz() {
  const r = S.run, q = BYID[r.ids[r.i]], n = r.ids.length, answered = r.picked !== null;
  const score = r.results.filter(x => x.ok).length;
  const L = "ABC";
  const opts = q.opts.map((o, i) => {
    let cls = "opt";
    if (answered) { if (i === q.ans) cls += " right"; else if (i === r.picked) cls += " wrong"; }
    const mark = answered && i === q.ans ? "✓" : (answered && i === r.picked ? "✗" : L[i]);
    return '<button class="' + cls + '" data-i="' + i + '"' + (answered ? " disabled" : "") + '><span class="ltr">' + mark + '</span><span class="txt">' + esc(o) + "</span></button>";
  }).join("");
  const ok = answered && r.picked === q.ans;
  const fb = answered
    ? '<div role="status" class="row"><span class="verdict ' + (ok ? "good" : "bad") + '">' + (ok ? "Correct" : "Incorrect. The answer is " + L[q.ans] + ".") + '</span><span class="spacer"></span>' +
      '<button class="btn primary" id="next">' + (r.i + 1 === n ? "See results" : "Next question") + "</button></div>"
    : '<p class="note">Choose an answer. Keys A, B, C also work.</p>';
  app.innerHTML =
    '<div class="qhead"><span class="count">' + (r.i + 1) + " / " + n + '</span><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + (r.i + (answered ? 1 : 0)) + '"><i style="width:' + (100 * (r.i + (answered ? 1 : 0)) / n) + '%"></i></div>' +
      '<span class="count">' + score + ' right</span></div>' +
    '<section class="panel"><div class="tags">' + (q.code ? '<span class="tag">' + esc(q.code) + "</span>" : "") +
      '<span class="tag">Q' + q.id + "</span>" + (q.fig ? '<span class="tag fig">Needs Figure ' + q.fig + " in FAA-CT-8080-2H</span>" : "") + "</div>" +
      '<p class="stem">' + esc(q.stem) + '</p><div class="opts">' + opts + "</div>" + fb + "</section>" +
    '<div class="row"><button class="btn quiet" id="quit">End round</button></div>';
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
  const nx = document.getElementById("next"); if (nx) { nx.addEventListener("click", next); nx.focus({ preventScroll: true }); }
  document.getElementById("quit").addEventListener("click", () => { S.view = r.results.length ? "results" : "home"; render(); });
}

function answer(i) {
  const r = S.run; if (r.picked !== null) return;
  const q = BYID[r.ids[r.i]], ok = i === q.ans;
  r.picked = i; r.results.push({ id: q.id, ok: ok, pick: i });
  const s = stats[q.id] || { t: 0, c: 0, l: false };
  s.t++; if (ok) s.c++; s.l = ok; stats[q.id] = s; save();
  quiz();
}
function next() {
  const r = S.run;
  if (r.i + 1 >= r.ids.length) { S.view = "results"; render(); window.scrollTo(0, 0); return; }
  r.i++; r.picked = null; quiz(); window.scrollTo(0, 0);
}

function results() {
  const r = S.run, n = r.results.length, good = r.results.filter(x => x.ok).length, p = pct(good, n);
  const bad = r.results.filter(x => !x.ok), L = "ABC";
  const list = bad.map(x => {
    const q = BYID[x.id];
    return '<div class="miss"><p class="q"><span class="mono">Q' + q.id + "</span> " + esc(q.stem) + "</p>" +
      '<p class="a r"><span class="k">You</span><span>' + L[x.pick] + ". " + esc(q.opts[x.pick]) + "</span></p>" +
      '<p class="a g"><span class="k">Answer</span><span>' + L[q.ans] + ". " + esc(q.opts[q.ans]) + "</span></p></div>";
  }).join("");
  app.innerHTML =
    '<div class="top"><h1>Round complete</h1></div>' +
    '<section class="panel"><div class="score"><b>' + good + " / " + n + '</b><b>' + p + '%</b>' +
      '<span class="pill ' + (p >= PASS * 100 ? "good" : "bad") + '">' + (p >= PASS * 100 ? "At or above 70% passing" : "Below 70% passing") + "</span></div>" +
      '<div class="row"><button class="btn primary" id="again">Next ' + QUIZ_LEN + '</button>' +
      (bad.length ? '<button class="btn" id="retry">Retry the ' + bad.length + " missed</button>" : "") +
      '<button class="btn quiet" id="home">Home</button></div></section>' +
    (bad.length ? '<section class="panel"><h2>Missed (' + bad.length + ")</h2>" + list + "</section>" : '<section class="panel"><p>No misses this round.</p></section>');
  document.getElementById("again").addEventListener("click", () => start(pick().map(q => q.id)));
  const rt = document.getElementById("retry"); if (rt) rt.addEventListener("click", () => start(shuffle(bad.map(x => x.id))));
  document.getElementById("home").addEventListener("click", () => { S.view = "home"; render(); window.scrollTo(0, 0); });
}

document.addEventListener("keydown", e => {
  if (S.view !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = S.run, k = e.key.toLowerCase();
  if (r.picked === null) {
    const idx = "abc".indexOf(k) >= 0 ? "abc".indexOf(k) : ("123".indexOf(k) >= 0 ? "123".indexOf(k) : -1);
    if (idx >= 0) answer(idx);
  } else if (k === "arrowright" || (k === "enter" && document.activeElement.id !== "next" && document.activeElement.id !== "quit")) { next(); }
});

render();
</script>
